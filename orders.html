<!DOCTYPE html>
<html>
<head>
  <title>View Orders</title>
  <link rel="stylesheet" href="style.css?v=21">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="navbar">
  <img class="logo" src="logo.png" alt="Refined Peptides UK">
  <div class="nav-buttons">
    <a href="index.html">New Order</a>
    <a href="orders.html">Orders</a>
  </div>
</div>

<div class="container">
  <h2 class="page-title">Orders</h2>

<button class="filter-open-btn" onclick="openFilters()">Filter Orders</button>

<div id="filterOverlay" class="filter-overlay hidden">
  <div class="filter-header">
    <button class="back-btn" onclick="closeFilters()">← Back</button>
    <h2>Filter Orders</h2>
  </div>

  <div class="filter-content">
    <label>Filter by status</label>
    <select id="statusFilter" onchange="renderOrderCards()">
      <option value="">All statuses</option>
    </select>

    <label>Search customer</label>
    <input
      id="customerSearch"
      type="text"
      placeholder="Search customer name..."
      oninput="renderOrderCards()"
    >

    <label>Date from</label>
    <input id="dateFrom" type="date" onchange="renderOrderCards()">

    <label>Date to</label>
    <input id="dateTo" type="date" onchange="renderOrderCards()">

    <button onclick="closeFilters()">Apply Filters</button>
    <button class="small-btn" onclick="clearFilters()">Clear Filters</button>
  </div>
</div>

  <div id="ordersContainer">Loading orders…</div>
</div>

<div id="orderDetail" class="order-detail hidden">
  <div class="detail-header">
    <button class="back-btn" onclick="closeOrder()">← Back</button>
    <h2 id="detailOrderId"></h2>
  </div>

  <div class="detail-content">
    <h3 id="detailCustomer"></h3>

    <div class="info-block">
      <strong>Status</strong>
      <p id="detailStatus"></p>
    </div>

    <div class="info-block">
      <strong>Shipping / Collection</strong>
      <p id="detailShipping"></p>
    </div>

    <div class="info-block">
      <strong>Customer Address</strong>
      <p id="detailAddress"></p>
    </div>

    <div class="info-block">
      <strong>Woo Order Notes</strong>
      <p id="detailWooNotes"></p>
    </div>

    <div class="info-block">
      <strong>Items</strong>
      <div id="detailItems"></div>
    </div>

    <label>Assign Order</label>
    <select id="detailAssignedTo"></select>

    <label>Payment Status</label>
    <select id="detailPaymentStatus">
      <option value="">Select payment status</option>
      <option value="Pending">Pending</option>
      <option value="Bank transfer received">Bank transfer received</option>
      <option value="Paid in cash">Paid in cash</option>
      <option value="Paid via card">Paid via card</option>
    </select>

    <label>Internal Notes</label>
    <textarea id="detailInternalNotes" placeholder="Staff-only notes..."></textarea>

    <button onclick="saveOrderDetails()">Save Changes</button>
    <button class="small-btn" onclick="markCompleted()">Mark Completed</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPrGq5XHiUMogsGtEMUFN3wr1aTFEYh8o-tgl3uVkGHWMk_eYcYl2Kz6pOXcRBFsP-/exec";

let orders = [];
let staffList = [];
let currentOrder = null;

loadInitialData();

function loadInitialData() {
  fetch(API_URL)
    .then(r => r.json())
    .then(data => {
      staffList = data.staff || [];
      loadOrders();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("ordersContainer").innerHTML =
        "<p>Could not load staff/products.</p>";
    });
}

function loadOrders() {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "listOrders" })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) {
      document.getElementById("ordersContainer").innerHTML =
        `<p>Error: ${data.message}</p>`;
      return;
    }

    orders = data.orders || [];
    populateStatusFilter();
    renderOrderCards();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("ordersContainer").innerHTML =
      "<p>Could not load orders.</p>";
  });
}

function renderOrderCards() {
  const container = document.getElementById("ordersContainer");

  const statusFilter = document.getElementById("statusFilter").value;
  const customerSearch = document.getElementById("customerSearch").value.toLowerCase().trim();
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;

  let filteredOrders = [...orders];

  if (statusFilter) {
    filteredOrders = filteredOrders.filter(order =>
      String(order.status || "") === statusFilter
    );
  }

  if (customerSearch) {
    filteredOrders = filteredOrders.filter(order =>
      String(order.customerName || "").toLowerCase().includes(customerSearch)
    );
  }

  if (dateFrom) {
    filteredOrders = filteredOrders.filter(order => {
      const orderDate = getOrderDate(order);
      return orderDate && orderDate >= new Date(dateFrom + "T00:00:00");
    });
  }

  if (dateTo) {
    filteredOrders = filteredOrders.filter(order => {
      const orderDate = getOrderDate(order);
      return orderDate && orderDate <= new Date(dateTo + "T23:59:59");
    });
  }

  if (!filteredOrders.length) {
    container.innerHTML = "<p>No orders match your filters.</p>";
    return;
  }

  let html = "";

  filteredOrders.forEach(order => {
    const items = Array.isArray(order.items) ? order.items : [];

    const itemSummary = items.length
      ? items.map(i => `${escapeHtml(i.product)} x${escapeHtml(i.quantity)}`).join("<br>")
      : "No items";

    html += `
      <div class="order-card" onclick="openOrder('${escapeAttr(order.orderId)}')">
        <div class="order-card-top">
          <strong>#${escapeHtml(order.orderId)}</strong>
          <span class="status-pill">${escapeHtml(order.status || "No status")}</span>
        </div>

        <h3>${escapeHtml(order.customerName || "No customer name")}</h3>

        <div class="order-card-items">
          ${itemSummary}
        </div>

        <div class="order-card-meta">
          <span>${escapeHtml(order.shippingMethod || "No method")}</span>
          <span>${escapeHtml(order.paymentStatus || "Payment pending")}</span>
        </div>

        <div class="assigned-line">
          Assigned: ${escapeHtml(order.assignedTo || "Unassigned")}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function populateStatusFilter() {
  const select = document.getElementById("statusFilter");

  if (!select) return;

  const currentValue = select.value;

  const statuses = [...new Set(
    orders
      .map(order => order.status)
      .filter(Boolean)
  )].sort();

  select.innerHTML = `<option value="">All statuses</option>`;

  statuses.forEach(status => {
    const option = document.createElement("option");
    option.value = status;
    option.textContent = status;
    select.appendChild(option);
  });

  select.value = currentValue;
}

function clearFilters() {
  document.getElementById("statusFilter").value = "";
  document.getElementById("customerSearch").value = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";

  renderOrderCards();
}

function getOrderDate(order) {
  if (order.orderDate) {
    const date = new Date(order.orderDate);
    return isNaN(date.getTime()) ? null : date;
  }

  return null;
}

function openOrder(orderId) {
  currentOrder = orders.find(o => String(o.orderId) === String(orderId));

  if (!currentOrder) {
    alert("Order not found.");
    return;
  }

  document.getElementById("detailOrderId").textContent = `Order #${currentOrder.orderId}`;
  document.getElementById("detailCustomer").textContent = currentOrder.customerName || "No customer name";
  document.getElementById("detailStatus").textContent = currentOrder.status || "No status";
  document.getElementById("detailShipping").textContent = currentOrder.shippingMethod || "Not set";
  document.getElementById("detailAddress").innerHTML = formatMultiline(currentOrder.customerAddress || "No address");
  document.getElementById("detailWooNotes").innerHTML = formatMultiline(currentOrder.wooOrderNotes || "No Woo notes");

  const items = Array.isArray(currentOrder.items) ? currentOrder.items : [];

  document.getElementById("detailItems").innerHTML = items.length
    ? items.map(i => `<div class="item-row">${escapeHtml(i.product)} <strong>x${escapeHtml(i.quantity)}</strong></div>`).join("")
    : "<p>No items</p>";

  populateStaffDropdown();
  document.getElementById("detailAssignedTo").value = currentOrder.assignedTo || "";
  document.getElementById("detailPaymentStatus").value = currentOrder.paymentStatus || "";
  document.getElementById("detailInternalNotes").value = currentOrder.internalNotes || "";

  document.getElementById("orderDetail").classList.remove("hidden");
}

function closeOrder() {
  document.getElementById("orderDetail").classList.add("hidden");
  currentOrder = null;
}

function populateStaffDropdown() {
  const select = document.getElementById("detailAssignedTo");

  let html = `<option value="">Unassigned</option>`;

  staffList.forEach(name => {
    html += `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`;
  });

  select.innerHTML = html;
}

function saveOrderDetails() {
  if (!currentOrder) return;

  const payload = {
    action: "saveOrderDetails",
    orderId: currentOrder.orderId,
    assignedTo: document.getElementById("detailAssignedTo").value,
    paymentStatus: document.getElementById("detailPaymentStatus").value,
    internalNotes: document.getElementById("detailInternalNotes").value
  };

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) {
      alert("Error: " + data.message);
      return;
    }

    alert("Order saved.");
    closeOrder();
    loadOrders();
  })
  .catch(err => {
    console.error(err);
    alert("Could not save order.");
  });
}

function markCompleted() {
  if (!currentOrder) return;

  if (!confirm("Mark this order as completed?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "fulfilOrder",
      orderId: currentOrder.orderId
    })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) {
      alert("Error: " + data.message);
      return;
    }

    alert("Order marked completed.");
    closeOrder();
    loadOrders();
  })
  .catch(err => {
    console.error(err);
    alert("Could not complete order.");
  });
}

function formatMultiline(text) {
  return escapeHtml(String(text)).replace(/\n/g, "<br>");
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#096;");
}
</script>

</body>
</html>
