<!DOCTYPE html>
<html>
<head>
  <title>View Orders</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

<div class="navbar">
  <img class="logo" src="logo.png" alt="Refined Peptides UK">
  <div class="nav-buttons">
    <a href="index.html">New Order</a>
    <a href="orders.html">View Orders</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>All Orders</h2>

    <div id="ordersContainer" style="color:white;">
      Loading orders…
    </div>

  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPrGq5XHiUMogsGtEMUFN3wr1aTFEYh8o-tgl3uVkGHWMk_eYcYl2Kz6pOXcRBFsP-/exec";

// Fetch orders on page load
fetch(API_URL, {
  method: "POST",
  body: JSON.stringify({ action: "listOrders" })
})
.then(r => r.json())
.then(data => {
  renderOrders(data.orders);
});

// Render orders into the page
function renderOrders(orders) {
  const container = document.getElementById("ordersContainer");

  if (!orders || orders.length === 0) {
    container.innerHTML = "<p>No orders found.</p>";
    return;
  }

  let html = `
    <table style="width:100%; border-collapse: collapse; color:white;">
      <tr style="border-bottom:1px solid #1f2937;">
        <th style="text-align:left; padding:8px;">Order #</th>
        <th style="text-align:left; padding:8px;">Customer</th>
        <th style="text-align:left; padding:8px;">Staff</th>
        <th style="text-align:left; padding:8px;">Items</th>
        <th style="text-align:left; padding:8px;">Note</th>
      </tr>
  `;

  orders.forEach(o => {
    const items = o.items
      .map(i => `${i.product} (${i.quantity})`)
      .join("<br>");

    html += `
      <tr style="border-bottom:1px solid #1f2937;">
        <td style="padding:8px;">${o.orderId}</td>
        <td style="padding:8px;">${o.customerName}</td>
        <td style="padding:8px;">${o.assignedTo || ""}</td>
        <td style="padding:8px;">${items}</td>
        <td style="padding:8px;">${o.notes || ""}</td>
      </tr>
    `;
  });

  html += "</table>";

  container.innerHTML = html;
}
</script>

</body>
</html>
