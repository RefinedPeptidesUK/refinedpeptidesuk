<!DOCTYPE html>
<html>
<head>
  <title>View Orders</title>
  <link rel="stylesheet" href="style.css?v=33">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="app-header">
  <img class="logo" src="logo.png" alt="Refined Peptides UK">

  <nav class="desktop-nav">
    <a href="index.html">New Order</a>
    <a href="orders.html">Orders</a>
    <a href="stock.html">Stock</a>
  </nav>
</div>

<nav id="mobileNav" class="mobile-bottom-nav">
  <a href="index.html">New Order</a>
  <a href="orders.html">Orders</a>
  <a href="stock.html">Stock</a>
</nav>

<div class="container">
  <h2 class="page-title">Orders</h2>

  <div class="orders-toolbar">
  <button class="filter-open-btn" onclick="openFilters()">Filter Orders</button>

  <button class="sync-btn" onclick="syncWooNow()">
    Sync Orders
  </button>
</div>

  <div id="filterOverlay" class="filter-overlay hidden">
    <div class="filter-header">
      <button class="back-btn" onclick="closeFilters()">← Back</button>
      <h2>Filter Orders</h2>
    </div>

    <div class="filter-content">
      <label>Filter by status</label>
      <select id="statusFilter" onchange="renderOrderCards()">
        <option value="">All statuses</option>
      </select>

      <label>Search customer</label>
      <input id="customerSearch" type="text" placeholder="Search customer name..." oninput="renderOrderCards()">

      <label>Date from</label>
      <input id="dateFrom" type="date" onchange="renderOrderCards()">

      <label>Date to</label>
      <input id="dateTo" type="date" onchange="renderOrderCards()">

      <button onclick="closeFilters()">Apply Filters</button>
      <button class="small-btn" onclick="clearFilters()">Clear Filters</button>
    </div>
  </div>

  <div id="ordersDashboard" class="orders-dashboard"></div>

  <div id="ordersContainer">Loading orders…</div>
</div>

<div id="orderDetail" class="order-detail hidden">
  <div class="detail-header">
    <button class="back-btn" onclick="closeOrder()">← Back</button>
    <h2 id="detailOrderId"></h2>
  </div>

  <div class="detail-content">
    <label>Customer Name</label>
    <input id="detailCustomerName">

    <label>Status</label>
    <select id="detailStatus">
      <option value="pending">Pending payment</option>
      <option value="on-hold">On hold</option>
      <option value="processing">Processing</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
      <option value="refunded">Refunded</option>
      <option value="failed">Failed</option>
      <option value="Manual Order">Manual Order</option>
    </select>

    <label>Order Total</label>
    <input id="detailOrderTotal" placeholder="e.g. 120.00">

    <label>Subtotal</label>
    <input id="detailSubtotal" placeholder="e.g. 130.00">

    <label>Discount</label>
    <input id="detailDiscount" placeholder="e.g. 10.00">

    <label>Shipping / Collection</label>
    <select id="detailShipping">
      <option value="">Select option</option>
      <option value="Delivery">Delivery</option>
      <option value="Collection">Collection</option>
    </select>

    <label>Customer Address</label>
    <textarea id="detailAddress"></textarea>

    <label>Woo / Customer Notes</label>
    <textarea id="detailWooNotes"></textarea>

    <label>Payment Method</label>
    <select id="detailPaymentMethod">
      <option value="">Select payment method</option>
      <option value="Bank transfer">Bank transfer</option>
      <option value="Cash">Cash</option>
      <option value="Card">Card</option>
      <option value="Other">Other</option>
    </select>

    <label>Coupon Code</label>
    <input id="detailCouponCode">

    <label>Items</label>
    <div id="detailItems"></div>
    <button id="addItemBtn" class="small-btn" onclick="addEditableItemRow()">+ Add Item</button>

    <label>Assign Order</label>
    <select id="detailAssignedTo"></select>

    <label>Payment Status</label>
    <select id="detailPaymentStatus">
      <option value="">Select payment status</option>
      <option value="Pending">Pending</option>
      <option value="Bank transfer received">Bank transfer received</option>
      <option value="Paid in cash">Paid in cash</option>
      <option value="Paid via card">Paid via card</option>
    </select>

<label>Internal Notes</label>
<textarea id="detailInternalNotes" placeholder="Staff-only notes..."></textarea>

<hr class="detail-divider">

<h3 class="detail-section-title">Customer Messaging</h3>

<label>Customer Email</label>
<input id="detailCustomerEmail" readonly>

<label>Tracking Number</label>
<div class="tracking-row">
  <input id="detailTrackingNumber" placeholder="Enter tracking number">
  <button type="button" class="small-btn tracking-btn" onclick="sendTrackingEmail()">
    Send Tracking
  </button>
</div>

<label>Custom Message</label>
<textarea
  id="detailCustomerMessage"
  placeholder="Write a custom customer update..."
></textarea>

<button
  type="button"
  class="small-btn"
  onclick="sendCustomerMessage()"
>
  Send Customer Message
</button>

<label>Message History</label>
<textarea
  id="detailMessageLog"
  readonly
  class="message-log"
></textarea>

<button onclick="saveOrderDetails()">Save Changes</button>
<button class="small-btn" onclick="markCompleted()">Mark Completed</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPrGq5XHiUMogsGtEMUFN3wr1aTFEYh8o-tgl3uVkGHWMk_eYcYl2Kz6pOXcRBFsP-/exec";

let orders = [];
let staffList = [];
let productList = [];
let currentOrder = null;

let ordersOffset = 0;
const ORDERS_LIMIT = 25;
let hasMoreOrders = false;

loadInitialData();

function loadInitialData() {
  fetch(API_URL)
    .then(r => r.json())
    .then(data => {
      staffList = data.staff || [];
      productList = data.products || [];
      loadOrders();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("ordersContainer").innerHTML =
        "<p>Could not load staff/products.</p>";
    });
}

function loadOrders(loadMore = false) {
  if (!loadMore) {
    ordersOffset = 0;
    orders = [];
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "listOrders",
      limit: ORDERS_LIMIT,
      offset: ordersOffset
    })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) {
      document.getElementById("ordersContainer").innerHTML =
        `<p>Error: ${data.message}</p>`;
      return;
    }

    const newOrders = data.orders || [];

    orders = loadMore
      ? orders.concat(newOrders)
      : newOrders;

    ordersOffset += newOrders.length;
    hasMoreOrders = !!data.hasMore;

    populateAssignedFilter();
    renderDashboard();
    renderOrderCards();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("ordersContainer").innerHTML =
      "<p>Could not load orders.</p>";
  });
}

function renderDashboard() {
  const dashboard = document.getElementById("ordersDashboard");
  if (!dashboard) return;

  const today = new Date().toLocaleDateString("en-GB");

  const processing = orders.filter(o =>
    String(o.status || "").toLowerCase() === "processing"
  ).length;

  const paymentPending = orders.filter(o =>
    String(o.paymentStatus || "").toLowerCase() === "payment pending" ||
    String(o.paymentStatus || "").toLowerCase() === "pending"
  ).length;

  const unassigned = orders.filter(o =>
    !String(o.assignedTo || "").trim()
  ).length;

  const todayCount = orders.filter(o => {
    const orderDate = getOrderDate(o);
    if (!orderDate) return false;

    return orderDate.toLocaleDateString("en-GB") === today;
  }).length;

  dashboard.innerHTML = `
    <div class="dashboard-pill">
      <strong>${processing}</strong>
      <span>Processing</span>
    </div>

    <div class="dashboard-pill">
      <strong>${paymentPending}</strong>
      <span>Payment pending</span>
    </div>

    <div class="dashboard-pill">
      <strong>${unassigned}</strong>
      <span>Unassigned</span>
    </div>

    <div class="dashboard-pill">
      <strong>${todayCount}</strong>
      <span>Today</span>
    </div>
  `;
}

function renderOrderCards() {

  const container = document.getElementById("ordersContainer");

  const statusFilter =
    document.getElementById("statusFilter").value;

  const customerSearch =
    document.getElementById("customerSearch")
      .value
      .toLowerCase()
      .trim();

  const dateFrom =
    document.getElementById("dateFrom").value;

  const dateTo =
    document.getElementById("dateTo").value;

  let filteredOrders = [...orders];

  if (statusFilter) {
    filteredOrders = filteredOrders.filter(order =>
      String(order.status || "") === statusFilter
    );
  }

  if (customerSearch) {
    filteredOrders = filteredOrders.filter(order =>
      String(order.customerName || "")
        .toLowerCase()
        .includes(customerSearch)
    );
  }

  if (dateFrom) {
    filteredOrders = filteredOrders.filter(order => {
      const orderDate = getOrderDate(order);
      return orderDate &&
        orderDate >= new Date(dateFrom + "T00:00:00");
    });
  }

  if (dateTo) {
    filteredOrders = filteredOrders.filter(order => {
      const orderDate = getOrderDate(order);
      return orderDate &&
        orderDate <= new Date(dateTo + "T23:59:59");
    });
  }

  filteredOrders.sort((a, b) => {
    const aDate = getOrderDate(a)?.getTime() || 0;
    const bDate = getOrderDate(b)?.getTime() || 0;
    return bDate - aDate;
  });

  if (!filteredOrders.length) {
    container.innerHTML =
      "<p>No orders match your filters.</p>";
    return;
  }

  let html = "";
  let currentDateGroup = "";

  filteredOrders.forEach(order => {

    const orderDate = getOrderDate(order);

    const dateLabel = orderDate
      ? orderDate.toLocaleDateString("en-GB", {
          day: "numeric",
          month: "long",
          year: "numeric"
        })
      : "Unknown Date";

    if (dateLabel !== currentDateGroup) {

      currentDateGroup = dateLabel;

      html += `
        <div class="orders-date-group">
          ${escapeHtml(dateLabel)}
        </div>
      `;
    }

    const total = order.orderTotal
      ? `£${escapeHtml(order.orderTotal)}`
      : "";

    html += `
      <div
        class="compact-order-card"
        onclick="openOrder('${escapeAttr(order.orderId)}')"
      >

        <div class="compact-order-top">

          <div class="compact-order-left">

            <div class="compact-order-id">
              #${escapeHtml(order.orderId)}
            </div>

            <div class="compact-order-name">
              ${escapeHtml(order.customerName || "No customer")}
            </div>

          </div>

          <div class="compact-order-right">

            <div class="compact-order-total">
              ${total}
            </div>

            <div class="compact-pill-stack">
              <div class="compact-status-pill">
                ${escapeHtml(order.status || "Processing")}
              </div>

              <div class="compact-payment-pill">
                ${escapeHtml(formatPaymentStatus(order.paymentStatus))}
              </div>
            </div>

          </div>

        </div>

        <div class="compact-order-assigned">
          Assigned: ${escapeHtml(order.assignedTo || "Unassigned")}
        </div>

      </div>
    `;
  });

  if (hasMoreOrders) {
  html += `
    <button class="small-btn load-more-btn" onclick="loadOrders(true)">
      Load More Orders
    </button>
  `;
}

container.innerHTML = html;
}

function populateStatusFilter() {
  const select = document.getElementById("statusFilter");
  if (!select) return;

  const currentValue = select.value;

  const statuses = [...new Set(
    orders.map(order => order.status).filter(Boolean)
  )].sort();

  select.innerHTML = `<option value="">All statuses</option>`;

  statuses.forEach(status => {
    const option = document.createElement("option");
    option.value = status;
    option.textContent = status;
    select.appendChild(option);
  });

  select.value = currentValue;
}

function clearFilters() {
  document.getElementById("statusFilter").value = "";
  document.getElementById("customerSearch").value = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  renderOrderCards();
}

function openFilters() {
  document.getElementById("filterOverlay").classList.remove("hidden");
}

function closeFilters() {
  document.getElementById("filterOverlay").classList.add("hidden");
}

function getOrderDate(order) {
  if (order.orderDate) {
    const date = new Date(order.orderDate);
    return isNaN(date.getTime()) ? null : date;
  }
  return null;
}

function openOrder(orderId) {
  currentOrder = orders.find(o => String(o.orderId) === String(orderId));

  if (!currentOrder) {
    alert("Order not found.");
    return;
  }

  document.getElementById("detailOrderId").textContent = `Order #${currentOrder.orderId}`;

  document.getElementById("detailCustomerName").value = currentOrder.customerName || "";
  document.getElementById("detailStatus").value = currentOrder.status || "";
  document.getElementById("detailOrderTotal").value = currentOrder.orderTotal || "";
  document.getElementById("detailSubtotal").value = currentOrder.subtotal || "";
  document.getElementById("detailDiscount").value = currentOrder.discount || "";
  document.getElementById("detailShipping").value = currentOrder.shippingMethod || "";
  document.getElementById("detailAddress").value = currentOrder.customerAddress || "";
  document.getElementById("detailWooNotes").value = currentOrder.wooOrderNotes || "";
  document.getElementById("detailPaymentMethod").value = currentOrder.paymentMethod || "";
  document.getElementById("detailCouponCode").value = currentOrder.couponCode || "";
  document.getElementById("detailCustomerEmail").value =
    currentOrder.customerEmail || "";

  document.getElementById("detailTrackingNumber").value =
    currentOrder.trackingNumber || "";

  document.getElementById("detailMessageLog").value =
    currentOrder.customerMessageLog || "";


  renderEditableItems(currentOrder.items || []);
  populateStaffDropdown();

  document.getElementById("detailAssignedTo").value = currentOrder.assignedTo || "";
  document.getElementById("detailPaymentStatus").value = currentOrder.paymentStatus || "";
  document.getElementById("detailInternalNotes").value = currentOrder.internalNotes || "";

  document.getElementById("orderDetail").classList.remove("hidden");
  document.body.classList.add("detail-open");
  
  setItemEditingLock(currentOrder.status);

}

function closeOrder() {
  document.getElementById("orderDetail").classList.add("hidden");
  currentOrder = null;
  document.body.classList.remove("detail-open");
}

function setItemEditingLock(status) {
  const isCompleted = String(status || "").toLowerCase() === "completed";

  document.querySelectorAll(".editable-product, .editable-qty").forEach(el => {
    el.disabled = isCompleted;
  });

  document.querySelectorAll(".remove-item-btn").forEach(btn => {
    btn.style.display = isCompleted ? "none" : "block";
  });

  const addBtn = document.getElementById("addItemBtn");
  if (addBtn) {
    addBtn.style.display = isCompleted ? "none" : "block";
  }
}

function populateStaffDropdown() {
  const select = document.getElementById("detailAssignedTo");

  let html = `<option value="">Unassigned</option>`;

  staffList.forEach(name => {
    html += `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`;
  });

  select.innerHTML = html;
}

function renderEditableItems(items) {
  const container = document.getElementById("detailItems");
  container.innerHTML = "";

  if (!items.length) {
    addEditableItemRow();
    return;
  }

  items.forEach(item => {
    addEditableItemRow(item.product, item.quantity);
  });
}

function addEditableItemRow(productValue = "", quantityValue = 1) {
  const container = document.getElementById("detailItems");

  const row = document.createElement("div");
  row.className = "editable-item-row";

  const productSelect = document.createElement("select");
  productSelect.className = "editable-product";

  let productOptions = `<option value="">Select product</option>`;

  productList.forEach(product => {
    const selected = String(product) === String(productValue) ? "selected" : "";
    productOptions += `<option value="${escapeAttr(product)}" ${selected}>${escapeHtml(product)}</option>`;
  });

  if (productValue && !productList.includes(productValue)) {
    productOptions += `<option value="${escapeAttr(productValue)}" selected>${escapeHtml(productValue)}</option>`;
  }

  productSelect.innerHTML = productOptions;

  const qtyInput = document.createElement("input");
  qtyInput.className = "editable-qty";
  qtyInput.type = "number";
  qtyInput.min = "1";
  qtyInput.value = quantityValue || 1;

  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "small-btn remove-item-btn";
  removeBtn.textContent = "Remove";
  removeBtn.onclick = () => row.remove();

  row.appendChild(productSelect);
  row.appendChild(qtyInput);
  row.appendChild(removeBtn);

  container.appendChild(row);
}

function collectEditableItems() {
  const rows = document.querySelectorAll(".editable-item-row");
  const items = [];

  rows.forEach(row => {
    const product = row.querySelector(".editable-product").value;
    const quantity = row.querySelector(".editable-qty").value;

    if (product && quantity) {
      items.push({
        product,
        quantity: Number(quantity)
      });
    }
  });

  return items;
}

function saveOrderDetails() {
  if (!currentOrder) return;

  const payload = {
    action: "saveOrderDetails",
    orderId: currentOrder.orderId,

    customerName: document.getElementById("detailCustomerName").value,
    status: document.getElementById("detailStatus").value,
    orderTotal: document.getElementById("detailOrderTotal").value,
    subtotal: document.getElementById("detailSubtotal").value,
    discount: document.getElementById("detailDiscount").value,
    shippingMethod: document.getElementById("detailShipping").value,
    customerAddress: document.getElementById("detailAddress").value,
    wooOrderNotes: document.getElementById("detailWooNotes").value,
    paymentMethod: document.getElementById("detailPaymentMethod").value,
    couponCode: document.getElementById("detailCouponCode").value,

    items: collectEditableItems(),

    assignedTo: document.getElementById("detailAssignedTo").value,
    paymentStatus: document.getElementById("detailPaymentStatus").value,
    internalNotes: document.getElementById("detailInternalNotes").value
  };

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) {
      alert("Error: " + data.message);
      return;
    }

    alert("Order saved.");
    closeOrder();
    loadOrders();
  })
  .catch(err => {
    console.error(err);
    alert("Could not save order.");
  });
}

function markCompleted() {
  if (!currentOrder) return;

  if (!confirm("Mark this order as completed? This will deduct stock if not already deducted.")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "fulfilOrder",
      orderId: currentOrder.orderId
    })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.success) {
      alert("Error: " + data.message);
      return;
    }

    alert("Order marked completed.");
    closeOrder();
    loadOrders();
  })
  .catch(err => {
    console.error(err);
    alert("Could not complete order.");
  });
}

function sendTrackingEmail() {

  if (!currentOrder) return;

  const trackingNumber =
    document.getElementById("detailTrackingNumber").value.trim();

  if (!trackingNumber) {
    alert("Please enter a tracking number.");
    return;
  }

  if (!confirm("Send tracking email to customer?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "sendTrackingMessage",
      orderId: currentOrder.orderId,
      trackingNumber
    })
  })
  .then(r => r.json())
  .then(data => {

    if (!data.success) {
      alert("Error: " + data.message);
      return;
    }

    alert("Tracking email sent.");

    loadOrders();

    document.getElementById("detailMessageLog").value =
      "Refreshing message history...";
  })
  .catch(err => {
    console.error(err);
    alert("Could not send tracking email.");
  });
}

function sendCustomerMessage() {

  if (!currentOrder) return;

  const message =
    document.getElementById("detailCustomerMessage").value.trim();

  if (!message) {
    alert("Please enter a message.");
    return;
  }

  if (!confirm("Send message to customer?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "sendCustomerMessage",
      orderId: currentOrder.orderId,
      message
    })
  })
  .then(r => r.json())
  .then(data => {

    if (!data.success) {
      alert("Error: " + data.message);
      return;
    }

    alert("Customer message sent.");

    document.getElementById("detailCustomerMessage").value = "";

    loadOrders();

    document.getElementById("detailMessageLog").value =
      "Refreshing message history...";
  })
  .catch(err => {
    console.error(err);
    alert("Could not send customer message.");
  });
}

function formatPaymentStatus(status) {
  const value = String(status || "").trim();

  if (!value || value.toLowerCase() === "pending") {
    return "Payment pending";
  }

  return value;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#096;");
}

async function syncWooNow() {

  const btn = document.querySelector(".sync-btn");

  btn.disabled = true;
  btn.textContent = "Syncing...";

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "syncWooOrders"
      })
    });

    const data = await response.json();

    alert(
      `Woo Sync Complete\n\nImported: ${data.imported ?? 0}\nUpdated: ${data.updated ?? 0}\nSkipped: ${data.skipped ?? 0}`
    );

    loadOrders();

  } catch (err) {

    console.error(err);

    alert("Woo sync failed.");

  } finally {

    btn.disabled = false;
    btn.textContent = "Sync Orders";

  }
}

</script>

</body>
</html>
