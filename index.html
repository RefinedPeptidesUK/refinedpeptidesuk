<!DOCTYPE html>
<html>
<head>
  <title>New Order</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="navbar">
  <img src="logo.png" alt="Refined Peptides UK">
  <div class="nav-buttons">
    <a href="index.html">New Order</a>
    <a href="orders.html">View Orders</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>New Order</h2>

    <label>Customer Name</label>
    <input id="customerName" placeholder="e.g. Jane Doe">

    <label>Staff Name</label>
    <select id="staffSelect"></select>

    <label>Products</label>
    <div id="productList"></div>

    <button class="small-btn" onclick="addProductRow()">+ Add Product</button>
    <button class="small-btn" onclick="showNote()">+ Add Order Note</button>


    <div id="noteContainer" style="display:none; margin-top:15px;">
      <label>Order Note</label>
      <textarea id="orderNote"></textarea>
    </div>

    <button onclick="submitOrder()" style="margin-top:20px;">Submit Order</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPrGq5XHiUMogsGtEMUFN3wr1aTFEYh8o-tgl3uVkGHWMk_eYcYl2Kz6pOXcRBFsP-/exec";

// Load products + staff on page load
fetch(API_URL)
  .then(r => r.json())
  .then(data => {
    window.products = data.products;
    window.staff = data.staff;
    populateStaff();
    addProductRow(); // start with one row
  });

// Populate staff dropdown
function populateStaff() {
  const staffSelect = document.getElementById("staffSelect");
  staff.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    staffSelect.appendChild(opt);
  });
}

// Add a new product row
function addProductRow() {
  const container = document.getElementById("productList");

  const row = document.createElement("div");
  row.className = "product-row";
  row.style.display = "flex";
  row.style.gap = "10px";
  row.style.marginBottom = "10px";

  // Product dropdown
  const productSelect = document.createElement("select");
  products.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    productSelect.appendChild(opt);
  });

  // Quantity dropdown
  const qtySelect = document.createElement("select");
  for (let i = 1; i <= 10; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    qtySelect.appendChild(opt);
  }
  const customOpt = document.createElement("option");
  customOpt.value = "custom";
  customOpt.textContent = "Custom…";
  qtySelect.appendChild(customOpt);

  // Custom quantity input (hidden initially)
  const customInput = document.createElement("input");
  customInput.type = "number";
  customInput.placeholder = "Qty";
  customInput.style.display = "none";

  qtySelect.addEventListener("change", () => {
    if (qtySelect.value === "custom") {
      qtySelect.style.display = "none";
      customInput.style.display = "block";
    }
  });

  row.appendChild(productSelect);
  row.appendChild(qtySelect);
  row.appendChild(customInput);

  container.appendChild(row);
}

// Show note field
function showNote() {
  document.getElementById("noteContainer").style.display = "block";
}

// Submit order
function submitOrder() {
  const customerName = document.getElementById("customerName").value;
  const staffName = document.getElementById("staffSelect").value;
  const note = document.getElementById("orderNote").value;

  const productRows = document.querySelectorAll(".product-row");
  const items = [];

  productRows.forEach(row => {
    const product = row.children[0].value;
    const qtySelect = row.children[1];
    const customInput = row.children[2];

    const quantity = qtySelect.style.display !== "none"
      ? qtySelect.value
      : customInput.value;

    if (product && quantity) {
      items.push({ product, quantity });
    }
  });

  const payload = {
    action: "submitOrder",
    customerName,
    staffName,
    items,
    note
  };

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(() => {
    alert("Order submitted!");
    window.location.href = "orders.html";
  });
}
</script>

</body>
</html>
