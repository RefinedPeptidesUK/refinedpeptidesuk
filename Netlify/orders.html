<!DOCTYPE html>
<html>
<head>
  <title>View Orders</title>
  <link rel="stylesheet" href="style-v2.css">
</head>
<body>

<div class="navbar">
  <img src="logo.png" alt="Refined Peptides UK">
  <div class="nav-buttons">
    <a href="index.html">New Order</a>
    <a href="orders.html">View Orders</a>
  </div>
</div>

<div class="container">
  <h2>Orders</h2>
  <div id="orders"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPrGq5XHiUMogsGtEMUFN3wr1aTFEYh8o-tgl3uVkGHWMk_eYcYl2Kz6pOXcRBFsP-/exec";

function loadOrders() {
  fetch(API_URL + "?action=listOrders")
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById("orders");
      container.innerHTML = "";

      data.orders.forEach(order => {
        const div = document.createElement("div");
        div.className = "order-card";

        div.innerHTML = `
          <strong>${order.customerName}</strong><br>
          ${order.items}<br>
          <small>${order.notes || ""}</small>

          <div class="order-actions">
            <button onclick="assign('${order.id}', 'Sam')">Sam</button>
            <button onclick="assign('${order.id}', 'Tyrun')">Tyrun</button>
            <button onclick="fulfil('${order.id}')">Fulfil</button>
          </div>
        `;

        container.appendChild(div);
      });
    });
}

function assign(id, staff) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "assignOrder", id, staff })
  }).then(() => loadOrders());
}

function fulfil(id) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "fulfilOrder", id })
  }).then(() => loadOrders());
}

loadOrders();
</script>

</body>
</html>
